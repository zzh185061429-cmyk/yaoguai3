        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/妖异体系

      - 名称: 武力与修行
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
