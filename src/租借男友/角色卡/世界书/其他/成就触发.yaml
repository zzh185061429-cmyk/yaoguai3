# 成就触发标签格式（剧情里程碑标记，不显示给玩家）

## 标签语法

<achievement>编号</achievement>

- 编号为纯数字，对应下方成就列表中的编号。
- 当剧情中发生了与某个成就触发条件匹配的事件时，必须在对应剧情段落之后、</content> 之前插入该标签。
- 标签独立成行，前后必须空行。
- 标签不会显示给玩家，仅用于前端在玩家阅读到该行时触发成就解锁通知。
- 同一段 <content> 中可以插入多个成就标签（如果同时触发了多个成就）。
- 每个成就编号在整个聊天中只需触发一次，重复触发相同编号无效。

## AI 可触发的成就列表

2. 赛博包身工（铜杯）— 触发条件：累计服务时长达到100小时
   → 当变量中 累计服务时长 ≥ 100 时触发

8. 这钱烫手啊！（银杯）— 触发条件：服务期间发生修罗场
   → 当正在服务某客户时，另一名有好感的角色撞见并产生明显冲突/尴尬场面时触发

9. 我真的一滴也没有了（金杯）— 触发条件：连续接单一周无休
   → 当连续7天每天都有服务订单完成时触发

10. 欢迎来到真实世界（铜杯）— 触发条件：首次阅读跑路字条
    → 当剧情中<user>首次读到父母跑路留言/字条时触发（仅开场白触发一次）

注意：编号 1、3、4、5、6、7 的成就是前端自动检测的，AI 无需也无法通过标签触发它们。

## 触发规则

- 严禁使用非列表中的成就编号。
- 严禁在剧情事件未实际发生时提前插入成就标签。
- 严禁在成就标签行混入对话/旁白/其他内容。
- 严禁将成就标签放在 <content> 外部。

## 正确示例

<content>
[scene:沈家别墅/一楼客厅]

沈千金从仅剩的椅子凳腿上找到了一个折起来的小块。

沈千金[惊讶]:"公司资金链断了，我和你爸先出国避避风头。这套房子已经抵押出去了，剩下三个亿的烂摊子，你们兄妹俩自己看着办吧。"

沈千金[害怕]:"哥，咱俩好像从大富翁变成大负翁了..."

<achievement>10</achievement>
</content>
↑ 正确：成就标签放在触发剧情之后、</content> 之前，独立成行，前后空行

<content>
[scene:鹿角奶茶店/二楼落地窗座位区]

温知晚[默认]:"你...累计服务已经满100小时了？"

<achievement>2</achievement>

温知晚[害羞]:*他真的好努力...*
</content>
↑ 正确：成就标签紧跟在触发条件的剧情段落之后

## 错误示例

<content>
温知晚[默认]:"今天的茶，你要喝吗？"
<achievement>3</achievement>
</content>
↑ 错误：编号3不是AI可触发的成就，且剧情未实际发生触发条件

