## 错误示例（绝对禁止）

温知晚:"今天的茶，你要喝吗？"
↑ 错误：省略了[情绪]标签

温知晚[默认]："今天的茶，你要喝吗？"
↑ 错误：使用了中文双引号

温知晚[开心]:"今天的茶，你要喝吗？"她轻轻推过去。
↑ 错误：对话行混入了动作和旁白，且前后没有空行

<user>:"好，谢谢。"
↑ 错误：省略了<user>的[情绪]标签

<content>
温知晚[默认]:"今天的茶，你要喝吗？"
