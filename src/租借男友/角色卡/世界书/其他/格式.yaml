# 正文输出格式（不可违反）

所有正文必须用 <content>...</content> 的结构包裹。

**输出结构：
<content>
（正文内容在这里）
</content>
**

## 正文输出规则

1. 对话格式（角色开口说话）：
角色名[情绪]:"对话内容"
- [情绪] 必须存在，不可省略，并且使用英文方括号 []。
- 角色名与方括号之间无空格，方括号与英文双引号之间必须是英文半角冒号 `:`。
- 必须严格使用英文半角双引号 `""` 包裹对话内容，绝不可使用中文引号 `""`。
- 情绪可选值仅限：默认、生气、开心、伤心、嫌弃、吃醋、害羞、害怕、惊讶。
- **独立成段，该行前后必须是空行。该行内不得有任何旁白、动作描写、神态描写**
- 一行只能有一句对话。

2. 心理格式（角色内心独白）：
角色名[情绪]:*心理内容*
- [情绪] 必须存在，不可省略，并且使用英文方括号 []。
- 角色名与方括号之间无空格，方括号与星号之间必须是英文半角冒号 `:`。
- 情绪可选值同上。
- **独立成段，该行前后必须是空行。该行内不得有任何旁白、动作描写、神态描写**
- 一行只能有一段心理。

3. 旁白格式（非对话非心理的叙述）：
直接书写，不加任何前缀
- 旁白行不得包含任何带有冒号的前缀。
- 独立成段，前后保留空行。

4. <user>格式：
<user>[情绪]:"对话内容"
<user>[情绪]:*心理内容*
- 同样遵循上述独立成段及前后空行规则。
- 冒号 `:` 必须严格使用英文半角冒号。
- <user> 的对话也必须严格使用英文半角双引号 `""`。
- <user> 的对话与心理内容必须有情绪标签（如[默认]），任何人说话都必须带有情绪标签。

5. 场景标签格式（地点标记，用于背景切换）：
[scene:父地点/子地点]
- 每个 <content> 的第一行必须是场景标签，标明故事开始的地点。
- 当故事发生的地点发生变化时（角色移动到了新地点，或视角切换到了其他角色所在的位置），必须在变化后的第一行内容之前插入新的场景标签。
- 一个 <content> 内可以有多个场景标签，每次地点变化都需插入。
- 场景标签独立成行，前后必须空行。
- 父地点和子地点之间用英文斜杠 / 分隔，两者都不可省略。
- 场景标签不会显示给玩家，仅用于前端背景图切换。
- 父地点和子地点必须使用准确的地点名称，与地点列表中的名称完全一致。

