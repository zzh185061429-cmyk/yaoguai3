---
租借男友APP设定:
**10月8日才刚刚注册，必须要10月9日起才会有人下单**
**10月8日才刚刚注册，必须要10月9日起才会有人下单**
**10月8日才刚刚注册，必须要10月9日起才会有人下单**
  运营结构:
    - 服务提供者：<user>
    - 经纪人：沈千金

  派单机制:
    - 每次抽取派单时，系统会随机选出三位客户下单，每位客户的下单内容是一段符合角色人设的自然语言描述
    - 不再区分任务类型，客户的描述内容自然包含想要做什么、时间、地点等信息
    - 由经纪人沈千金将三份订单转交给<user>，<user>从中选择一个接受

  时长机制:
    短时单:
      - 按次/小时计费
      - 适用于日常约会、看电影、吃饭等
      - 通常不超过8小时，不过夜
    包日单:
      - 覆盖全天（12-24小时）
      - 适用于全天游玩、陪伴
      - 可选择是否包含过夜陪伴
    多日连包:
      - 连续2天及以上
      - 适用于跨市旅游、长途旅行、长期同居体验、回老家见父母等
      - 需要提前排期，沈千金需预留出完整的档期
      - 费用按单日费用的倍数计算，或由经纪人与客户协商打包价

  信息知晓层级:
    完全知情者（姜朝渔、裴今歌）:
      - 知道所有客户的存在
      - 知道债务已被裴今歌清零
      - 知道千金在运营经纪人业务
      - 知道彼此都在点单
      - 以"好玩"或"关心"的心态参与
    不知情者（温知晚、周念安、傅霁、椎名律、罗兰、霍千黎、步玲燕、季明舒）:
      - 理论上互不知晓其他客户存在
      - 偶遇时可能会意外发现对方也是客户
      - 不知道债务真相
      - 不知道姜朝渔和裴今歌的知情身份
    沈千金:
      - 知道所有客户身份和点单记录
      - 不知道债务已被裴今歌清零
      - 不知道姜朝渔在背后维持沈家体面
      - 以为自己在真正帮<user>还债

  单日基础收入（按角色，多日则按天数累加）:
    姜朝渔: 50万/天
    裴今歌: 50万/天
    季明舒: 50万/天
    陆时予: 1万/天
    罗兰: 1万/天
    霍千黎: 1万/天
    傅霁: 8000/天
    温知晚: 5000/天
    椎名律: 3000/天
    周念安: 2000/天
    步玲燕: 200/天
    陆时予: 10000/天
    许不倦: 3000/天

  债务账本（千金记录）:
    - 千金认知中的总债务：三亿
    - 实际债务：零
    - 收入正常累加，千金逐笔记录
    - 账面"剩余债务"随收入逐步下降
    - 这笔钱实际上在积攒，但千金以为在还债
