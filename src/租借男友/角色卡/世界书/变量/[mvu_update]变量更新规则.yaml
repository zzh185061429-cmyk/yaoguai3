---
变量更新规则:
  时间:
    当前日期时间:
      format: MM月DD日 HH:mm
      check:
        - 每次事件推进、休息或对话轮次结束后按剧情需要推进，保持合理流逝
        - 若场景发生跨天跳跃需说明原因
    当前星期:
      check:
        - 自动从当前日期时间推导，无需手动单独更新

  状态:
    当前地点:
      check:
        - 角色移动到新地点时更新
        - 若存在状态为"进行中"的角色服务，地点不可变更（受预约约束）

  今日派单:
    客户:
      type: z.enum(['温知晚', '周念安', '傅霁', '椎名律', '姜朝渔', '裴今歌', '罗兰', '霍千黎', '季明舒', '步玲燕','陆时予','许不倦']) | '待定'
      check:
        - 从派单指令文本中解析提取客户名
        - 无派单时为"待定"
    描述:
      check:
        - 客户下单的自然语言描述，符合角色人设
        - 包含客户想做什么、时间、地点等信息
    预约时间:
      format: MM月DD日 HH:mm
      check:
        - 从派单指令文本中解析提取，必须严格晚于当前时间
        - 时段约束为 8:00~21:00，禁止生成半夜单
    服务时长:
      type: number
      check:
        - 从派单指令文本中解析提取小时数值
    价格:
      type: number
      check:
        - 从派单指令文本中解析提取数值（去除¥符号与逗号后转换为数值型）
        - 写入时同步将本字段数值累计加入 经济.累计收入

  经济:
    总债务:
      type: number
      check:
        - 初始值为 300000000，仅在剧情发生重大转折时调整
    累计收入:
      type: number
      check:
        - 每次派单指令写入时同步累加价格
        - 客户在剧情中主动且明确给出额外打赏时即时累加
        - 不可由AI自行编造收入或手动单独修改
    剩余债务:
      type: number
      check:
        - 自动计算得出：max(0, 总债务 - 累计收入)
        - 只读字段，收入变动后同步更新，归零时视为通关条件达成

  角色数据.${温知晚|周念安|傅霁|椎名律|姜朝渔|裴今歌|罗兰|霍千黎|季明舒|步玲燕}:
    type: |-
      {
        剩余服务小时: number;
        剩余服务分钟: number;
        服务状态: '无服务' | '未开始' | '进行中';
      }
    服务状态:
      check:
        - 派单指令写入时，将对应客户设为"未开始"，同时初始化 剩余服务小时（等于服务时长）和 剩余服务分钟（0）
        - 每次时间推进后检查：若状态为"未开始"且当前时间 >= 对应预约时间，自动切换为"进行中"
        - 状态为"进行中"时，每轮时间推进后根据时间差重新计算剩余时间
        - 当剩余总时间 <= 0 时，切换为"无服务"，并将 剩余服务小时 与 剩余服务分钟 归零
    剩余服务小时:
      type: number
      range: 0~无上限
      check:
        - "未开始"状态：固定等于对应服务时长，保持冻结
        - "进行中"状态：等于 floor(剩余总分钟 / 60)
        - "无服务"状态：归 0
    剩余服务分钟:
      type: number
      range: 0~59
      check:
        - "进行中"状态：等于 剩余总分钟 % 60
        - 其他状态：归 0
