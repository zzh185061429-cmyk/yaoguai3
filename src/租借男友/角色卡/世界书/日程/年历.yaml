---

年历系统设定:
  学期框架概述:
    秋季学期: 9月初至1月中旬
    寒假: 1月中旬至2月下旬，约6周
    春季学期: 2月下旬至6月底
    暑假: 7月初至8月底

  天气与特殊节点机制:
    雨天: 周念安休息日，阻碍室外移动，罗兰旧伤隐痛，步玲燕摆摊收入锐减或停摊，陆时予给周念安放假并独自在吧台研磨咖啡豆拼配新口味，许不倦在教研室用保温杯泡枸杞
    雪天: 增加道路湿滑度，椎名律初见大雪
    极端高温: 傅霁停止室外活动，许不倦拒绝离开空调房
    大风: 裴今歌停止无遮挡室外活动
    运动会: 10至11月，全校停课1至2天，千金担任啦啦队，温知晚参与舞蹈表演，罗兰参加田径项目，季明舒观赛拍摄素材，许不倦作为教师代表在看台后排摸鱼
    校园文艺汇演: 12月或5月，艺术楼使用率增加，季明舒参与编导实践
    毕业季: 6月，大三升大四节点，步玲燕毕业，许不倦带薪休假前夕

  秋季_9至11月:
    气候特征: 气温转凉，银杏由黄转落叶，傅霁室外活动抗性降低
    十月_故事起点:
      国庆假期_10月1至7日:
        放假情况: 全校无课，7天连休
        角色动向:
          周念安: 回头草咖啡全天加班
          陆时予: 照常营业
          傅霁: 连续7天单人公寓内活动
          姜朝渔: 公司放假，事务量减少
          千金: 制定连休期接单排期
          霍千黎: 参加卡牌店多场店赛
          罗兰: 兵击俱乐部全天训练
          步玲燕: 摆摊收入高峰期，游客增多
          季明舒: 连续7天福利院志愿+深夜写作
          许不倦: 连续7天在公寓内肝放置类手游，应对父母三次电话查岗
      万圣节_10月31日:
        放假情况: 不放假
        校内状态: 学生会社团举办晚间活动，椎名律参与，霍千黎旁观并拍照，季明舒策划编导系万圣节短片
    十一月:
      双十一_11月11日: 千金接收大量快递包裹，霍千黎网购卡牌，罗兰网购高热量零食，季明舒囤言情小说
      期中考试周_11月中旬: 千金、椎名律、傅霁首次大学考试，大二大三课业复习量增加，步玲燕无考试压力（论文制），季明舒提交编导中期作业，许不倦被分配两场公共课监考
      许不倦生日_11月20日: 照常给学生上形势与政策课，下课后在教研室玩手游，准备固定话术应付父母催婚电话

  冬季_12至2月:
    气候特征: 气温最低，出现降雪，校园树木落叶，室内启用暖气。傅霁使用毛毯，温知晚热身时间延长，罗兰增加高热量摄入，步玲燕摆摊时间缩短
    十二月:
      平安夜与圣诞节_12月24至25日: 不放假，商圈增设装饰，椎名律参与节日活动，罗兰与霍千黎在公寓准备法式大餐，季明舒策划圣诞主题短片
      贝斯静音纪念日_12月20日: 陆时予下班后在公寓独自弹奏两首曲子
      跨年夜_12月31日: 晚间外出活动量增加
    一月:
      元旦假期_1月1日: 放假1天
      期末考试周_1月上旬: 全员备考，傅霁提交数媒期末作品，季明舒提交学期短片，步玲燕提交论文阶段稿，许不倦批改四个大班的期末开卷试卷
      寒假开始_1月中旬:
        角色动向:
          离校: 温知晚、周念安
          留守: 千金、<user>、姜朝渔、裴今歌、霍千黎、罗兰、季明舒、陆时予、许不倦
          不确定: 椎名律、傅霁、步玲燕
    二月:
      春节假期:
        放假情况: 寒假内连休7天
        角色动向: 千金与<user>在别墅度过，罗兰好奇中国春节习俗，季明舒在公寓独自度过或参加家宴，步玲燕回老家，陆时予可能回老家探望父母，许不倦用租借男友应付父母视频通话
      情人节_2月14日: 仅留城角色可触发接触
      开学_2月下旬: 全员回归校区，许不倦重新开启NPC讲课模式

  春季_3至5月:
    气候特征: 气温回升，早晚温差大，校园花卉开放
    三月:
      SCA高级证书获取日_3月5日: 陆时予日常工作
      白色情人节_3月14日: 椎名律存在节日习惯
      步玲燕开摊纪念日_3月15日: 步玲燕大三下学期首次摆摊日
    四月:
      清明假期_4月上旬: 放假1天加周末连休共3天，全员在校
      步玲燕生日_4月1日: 愚人节当天，本人持无所谓态度
    五月:
      劳动节假期_5月1至5日: 放假5天，商圈人流量达峰值，步玲燕摆摊旺季
      母亲节_5月第二个周日: 温知晚返家或通话，周念安通话及转账，霍千黎与母亲通话
      期中考试周_5月中旬: 全员复习备考
      陆时予生日_5月18日: 照常营业，制作专属特调咖啡，周念安赠送小礼物
      扣薪日_5月25日: 许不倦首次因下午两点半的课被督导查岗扣除五百元工资的日期

  夏季_6至8月:
    气候特征: 气温最高，偶发暴雨，太阳辐射强。傅霁拒绝日间室外活动
    六月:
      端午假期: 放假1天加周末连休共3天
      留校确认日_6月10日: 研究生毕业前夕，导师通知许不倦获得青苗计划留校任教名额的日期
      步玲燕毕业: 6月，论文答辩，摆摊是否继续取决于去向
      期末考试周_6月中下旬: 学期末复习备考，季明舒提交期末短片作品，许不倦提交本学期教学材料归档
      暑假开始_6月底:
        角色动向:
          留城: 千金、周念安打工，罗兰、霍千黎，季明舒，陆时予，许不倦
          离校: 未定
          特殊: 温知晚可能参与暑期集训
    七至八月:
      季明舒生日_7月22日: 暑假期间，自行策划生日派对
      回头草开业日_8月8日: 回头草咖啡全场饮品八折
      七夕_农历七月初七: 仅留城角色可触发接触

